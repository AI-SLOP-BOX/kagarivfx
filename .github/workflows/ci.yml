name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps (GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev libasound2-dev

      - name: Format check
        run: cargo fmt --check || true

      - name: Clippy (all features, warnings = errors)
        run: cargo clippy --all-features -- -D warnings

      - name: Run all tests
        run: cargo test --all-features

      - name: CLI smoke test
        run: |
          cargo run --features cli --bin aevfx -- effects
          cargo run --example gen_test_project
          cargo run --features cli --bin aevfx -- validate --project test_project.json
          cargo run --features cli --bin aevfx -- frame --project test_project.json --frame 5 --output /tmp/smoke.png
