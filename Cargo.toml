[package]
name = "aftereffects-oss"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.27.2", features = ["wgpu"] }
log = "0.4.21"
env_logger = "0.11.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.15.0", features = ["derive"] }
wgpu = "0.19.4"
# Rhai: lightweight Rust-native scripting engine for AE-style expressions
rhai = { version = "1.18", features = ["sync"] }
# rand: for film grain and procedural noise
rand = "0.8"
# egui_extras for SVG icon rendering support
egui_extras = { version = "0.27.2", features = ["svg"] }

[features]
default = ["wgpu"]
wgpu = []
